name: Bug report
description: Report a bug in the Go MCP SDK
type: Bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Keep it short: what happened, what you expected, and how to reproduce it.

        Issues from outside the maintainer team are **closed automatically** unless every required box below is ticked; see [CONTRIBUTING.md](https://github.com/modelcontextprotocol/go-sdk/blob/main/CONTRIBUTING.md#how-issues-get-in). Questions belong in [Discussions](https://github.com/modelcontextprotocol/go-sdk/discussions), and security vulnerabilities must be [reported privately](https://github.com/modelcontextprotocol/go-sdk/blob/main/SECURITY.md).

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Only tick a box if it's true; the production one is optional. False statements may get you blocked from the repository.
      options:
        - label: "I searched the existing issues, and this has not been reported before."
          required: true
        - label: "This is a real problem that I ran into myself, using the latest release of the SDK."
          required: true
        - label: "I ran into it in a production system, not in a toy example, a benchmark, or an automated or AI-driven scan of the code."
          required: false
        - label: "I (a human) examined the relevant SDK code, and wrote or reviewed every line of this report. It is not unreviewed AI output."
          required: true
        - label: "This report is brief and concise, and sticks to the facts needed to understand the problem."
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you saw, and what you expected to see instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: The smallest program or the exact steps that trigger the problem with the latest release.
      render: go
    validations:
      required: true

  - type: input
    id: production
    attributes:
      label: Where did you hit this?
      description: One line on the system you hit it in, and how it uses the SDK.
    validations:
      required: false

  - type: input
    id: sdk-version
    attributes:
      label: Go MCP SDK version
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Output of `go version`.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Only the lines relevant to the problem.
      render: text
