# Issue intake gate — see CONTRIBUTING.md ("How issues get in") for the policy
# and .github/scripts/issue_intake_gate.js for the rules as applied.
#
# In short: an issue from someone without triage rights stays open only if its
# description ticks every required checklist item in the issue forms (not a
# duplicate, a real problem, examined by a human, reported concisely); the
# optional "hit in production" box is not enforced. Otherwise the issue is
# labeled `missing-checklist`, gets one comment, and is closed as not planned,
# and it reopens automatically once the author ticks the boxes. Bots are
# skipped. A triage+ user reopening the issue, removing the label, or adding
# `bypass-checklist` overrides.
#
# Operating it:
#   - Live by default. To pause it without a revert, set the repository
#     variable ISSUE_GATE_ENFORCE to "false": runs then only log their verdicts.
#   - Issues below the number in the job `if:` predate the gate and are ignored
#     unless evaluated by hand: `gh workflow run require-issue-checklist.yml -f issue_number=N`.
#
# Security: the job checks out only the default branch, for the script, and
# treats the issue body as data; nothing from it reaches a shell.

name: Require Issue Checklist

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to evaluate
        required: true
        type: number

permissions: {}

jobs:
  gate:
    name: Evaluate
    # Routing only; the rules are in the script. Issue events run at or above
    # the grandfathering floor, or for issues the gate has already labeled;
    # label events only for the two labels the gate cares about.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        !github.event.issue.pull_request &&
        (
          github.event.issue.number >= 1461 ||
          contains(github.event.issue.labels.*.name, 'missing-checklist') ||
          github.event.action == 'unlabeled'
        ) &&
        (github.event.action != 'unlabeled' || github.event.label.name == 'missing-checklist') &&
        (github.event.action != 'labeled' || github.event.label.name == 'bypass-checklist')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: require-issue-checklist-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: false
    permissions:
      contents: read # check out the gate script from the default branch
      issues: write # label, comment on, close, and reopen the issue
    env:
      ENFORCE: ${{ vars.ISSUE_GATE_ENFORCE != 'false' && 'true' || 'false' }} # kill switch: set the variable to "false" to go log-only
      ISSUE_NUMBER_INPUT: ${{ inputs.issue_number }}
    steps:
      - name: Check out the gate script (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Evaluate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = require('./.github/scripts/issue_intake_gate.js');
            await run({ github, context, core });
